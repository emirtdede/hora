ShortDescription: Local-first screen time tracking for Windows.
Description: >-
  Hora measures how long you spend in each application and on each website.
  Tracking runs entirely on the device with a local SQLite database, no account,
  no telemetry, and no cloud server. It ships 28 color palettes, 73 complete
  languages, accessibility zoom and text scale, a tray integration, a global
  hotkey, and a serverless backup folder with rotation and corruption recovery.
