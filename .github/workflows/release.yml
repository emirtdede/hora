name: Release

on:
  push:
    tags:
      - "1.0.0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Publish and package
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CI: "true"
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Locales and tests
        run: |
          node scripts/check-locales.mjs
          dotnet test Hora.slnx -c Release

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build portable folder and installer
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version "1.0.0"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hora-1.0.0
          path: |
            dist/Hora-Setup-1.0.0.exe
            dist/Hora-Portable-1.0.0.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Hora 1.0.0
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/Hora-Setup-1.0.0.exe
            dist/Hora-Portable-1.0.0.zip
            dist/SHA256SUMS.txt
